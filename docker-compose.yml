services:
  # Microservice 1: System Monitor & IPC Management
  monitor:
    build:
      context: ./monitor
      dockerfile: Dockerfile
    image: bioacustic-monitor:latest
    container_name: bioacustic-monitor
    restart: unless-stopped
    cap_add:
      - SYS_TIME
    devices:
      - "/dev/ttyAMA0:/dev/ttyAMA0"
    volumes:
      - /var/lib/threat_system:/var/lib/threat_system
      - /var/log/threat_evidence:/var/log/threat_evidence
     # - /var/lib/threat_system/cetrs:/var/lib/threat_system/certs
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Guayaquil
      - DATABASE_URL=sqlite:////var/lib/threat_system/threats.db
      - FIFO_PIPE_PATH=/var/lib/threat_system/pipe_monitor
      - EVIDENCE_DIR=/var/log/threat_evidence
      - STEP_CA_CERT=/app/certs/root_ca.crt
      - FACTORY_CLAIM_SECRET=${FACTORY_CLAIM_SECRET}
      - THREAT_API_URL=${THREAT_API_URL:-https://192.168.1.88:8444/api/sincronizar}
      - VOLTAGE_API_URL=${VOLTAGE_API_URL:-https://192.168.1.88:8444/api/telemetry/voltage}
      - DEVICE_TELEMETRY_API_URL=${DEVICE_TELEMETRY_API_URL:-https://192.168.1.88:8444/api/telemetry/status}
      - DEVICE_ENROLLMENT_URL=${DEVICE_ENROLLMENT_URL:-https://192.168.1.88:8444/v1/inscripcion}
#    command: detect

  analyzer:
#    build:
#      context: ./analyzer
#      dockerfile: Dockerfile
#    image: bioacustic-analyzer:latest
    image: ghcr.io/malbuja10/monitor-threat-system/analyzer:latest
    container_name: bioacustic-analyzer
    restart: unless-stopped
    devices:
      - "/dev/snd:/dev/snd"
    volumes:
      - /var/lib/threat_system/:/var/lib/threat_system
      - /var/log/threat_evidence:/var/log/threat_evidence
    environment:
      - TZ=America/Guayaquil
      - FIFO_PIPE_PATH=/var/lib/threat_system/pipe_monitor
      - EVIDENCE_DIR=/var/log/threat_evidence
      - MIN_EVIDENCE_FREE_MB=256
      - MODEL_ROOT=/var/lib/threat_system/models
      - THREAT_CONFIG_PATH=/var/lib/threat_system/models/current/threat_config.yaml
 #   command: python3 realtime_analyzer.py
